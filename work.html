<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta id="page-description"
        name="description"
        content="Selected architectural work by Haotian Zhang.">

  <title>
    Selected Work — Haotian Zhang
  </title>

  <link rel="icon"
        type="image/png"
        href="images/favicon/favicon.png">

  <link rel="stylesheet"
        href="style.css">

</head>


<body>

  <div class="page">


    <!-- HEADER -->

    <header class="site-header">

      <a class="site-name"
         href="index.html">
        HAOTIAN ZHANG
      </a>


      <nav class="site-nav">

        <a href="index.html#work">
          SELECTED WORK
        </a>

        <a href="projects.html">
          PROJECT INDEX
        </a>

        <a href="journal.html">
          JOURNAL
        </a>

        <a href="about.html">
          ABOUT
        </a>

        <a href="cv.html">
          CV
        </a>

      </nav>

    </header>



    <main class="project-page">


      <!-- TITLE -->

      <section class="project-detail-header">

        <div class="project-detail-kicker"
             id="work-kicker">
        </div>

        <h1 class="project-detail-title"
            id="work-title">
        </h1>

      </section>



      <!-- HERO + INFORMATION -->

      <section class="project-hero-layout">


        <div class="project-hero-image"
             id="work-hero">
        </div>



        <aside class="project-sidebar">


          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Location
            </div>

            <div class="project-sidebar-value"
                 id="work-location">
            </div>

          </div>



          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Typology
            </div>

            <div class="project-sidebar-value"
                 id="work-typology">
            </div>

          </div>



          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Office
            </div>

            <div class="project-sidebar-value"
                 id="work-office">
            </div>

          </div>



          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Role
            </div>

            <div class="project-sidebar-value"
                 id="work-role">
            </div>

          </div>



          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Year
            </div>

            <div class="project-sidebar-value"
                 id="work-year">
            </div>

          </div>



          <div class="project-sidebar-group">

            <div class="project-sidebar-label">
              Status
            </div>

            <div class="project-sidebar-value"
                 id="work-status">
            </div>

          </div>


        </aside>


      </section>



      <!-- DESCRIPTION -->

      <section class="project-copy-section">


        <div class="project-copy-label">
          Project
        </div>


        <div class="project-copy"
             id="work-copy">
        </div>


      </section>



      <!-- GALLERY -->

      <section class="project-gallery"
               id="work-gallery">
      </section>



      <!-- NAVIGATION -->

      <section class="project-end">


        <div id="work-previous">
        </div>


        <div class="project-end-next"
             id="work-next">
        </div>


      </section>


    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

      <div>
        © 2026 HAOTIAN ZHANG
      </div>

      <div>
        NEW YORK
      </div>

    </footer>


  </div>



  <script src="site-data.js"></script>
  <script src="site.js"></script>

  <script src="work-data.js"></script>
  <script src="work.js"></script>


</body>

</html>
